# DARKFLUENZER – zentrale Engine-, Modell- und Workflow-Registry (Phasenplan §4).
# Einzige Quelle für: welche Modelldatei wo liegt, welche Engine sie nutzt, welcher Workflow die
# Engine ausführt und welche Abnahme-Gates bestanden sind.
#
# Ablage:  local/models/<ComfyUI-Typ>/<Familie>/<Datei>   (ComfyUI sieht sie als "<Familie>/<Datei>")
# Pflege:  darkfluenzer models status | download --wave N | --engine ID | verify | orphans
#          Neue Datei: [files.*] mit Revision + SHA-256 eintragen, Engine referenziert den Schlüssel.
#          Engine entfernen: Eintrag löschen, dann "models orphans" listet nicht mehr benutzte Dateien.
# Gates:   OFFEN | PASS | FAIL | GESPERRT   (load, render, quality, license_pass)
# usage:   "evaluation" (Forschung/A-B-Test) – "production" nur wenn ALLE vier Gates PASS sind.

schema = 1
reserve_gb = 30   # Downloads verweigern, wenn danach weniger frei bliebe

# Gemeinsame Auswahllisten (ComfyUI 0.45.3, /object_info KSampler)
[choices]
samplers = ["euler", "euler_cfg_pp", "euler_ancestral", "euler_ancestral_cfg_pp", "heun", "heunpp2", "exp_heun_2_x0", "exp_heun_2_x0_sde", "dpm_2", "dpm_2_ancestral", "lms", "dpm_fast", "dpm_adaptive", "dpmpp_2s_ancestral", "dpmpp_2s_ancestral_cfg_pp", "dpmpp_sde", "dpmpp_sde_gpu", "dpmpp_2m", "dpmpp_2m_cfg_pp", "dpmpp_2m_sde", "dpmpp_2m_sde_gpu", "dpmpp_2m_sde_heun", "dpmpp_2m_sde_heun_gpu", "dpmpp_3m_sde", "dpmpp_3m_sde_gpu", "ddpm", "lcm", "ipndm", "ipndm_v", "deis", "cfgpp_ud10_ab", "res_multistep", "res_multistep_cfg_pp", "res_multistep_ancestral", "res_multistep_ancestral_cfg_pp", "gradient_estimation", "gradient_estimation_cfg_pp", "er_sde", "seeds_2", "seeds_3", "sa_solver", "sa_solver_pece", "ddim", "uni_pc", "uni_pc_bh2"]
schedulers = ["simple", "sgm_uniform", "karras", "exponential", "ddim_uniform", "beta", "normal", "linear_quadratic", "kl_optimal"]

[roles]
# Produktive Rollen werden erst nach A/B-Vergleich und LICENSE_PASS gesetzt.
image_master = ""
image_edit = ""
video_i2v = ""

# ------------------------------------------------------------------------------------ Engines

# Prüfkette E16/E17 (SP5 Schritt 7): das Backend setzt diese Knoten beim Einreichen zwischen
# Dekodieren und jeden SaveImage-Knoten der Bild-Workflows bzw. vor CreateVideo der
# Video-Workflows; sie liefern nur Messwerte.
# Video (SP5 Schritt 7): Prüfungen mit video = "frames" bekommen jedes every-te und das letzte Frame,
# höchstens max_frames; video = "all" bekommt alle Frames (zeitliche Konsistenz)
[check_frames]
node = "DarkfluenzerFrameSample"
every = 8
max_frames = 12

[checks.content]
node = "DarkfluenzerContentRating"
engine = "content_check"
video = "frames"
inputs = { detector = "nudenet/640m.onnx", classifier = "freepik_nsfw/model.safetensors", min_region_score = 0.2 }

[checks.quality]
node = "DarkfluenzerImageQuality"
engine = "quality_tech"
video = "frames"

[checks.temporal]
node = "DarkfluenzerTemporal"
engine = "quality_tech"
image = false
video = "all"
inputs = { jump_factor = 4.0 }

[checks.quality_score]
node = "DarkfluenzerQualityScore"
engine = "quality_vlm"
inputs = { model = "q_realign_pro_9b/config.json", aesthetics = true }

[checks.prompt_fidelity]
node = "DarkfluenzerPromptFidelity"
engine = "prompt_vlm"
prompt = true
inputs = { model = "qwen3_vl_8b/config.json" }

[checks.hands]
node = "DarkfluenzerHandCheck"
engine = "hands_check"
video = "frames"
inputs = { palm = "hands/palm_detection_mediapipe_2023feb.onnx", gate = "hands/counthallu_quality_maxvit_small.pth", min_palm_score = 0.6 }

[checks.identity]
node = "DarkfluenzerFaceIdentity"
engine = "identity"
character = true
video = "frames"
inputs = { detector = "opencv/face_detection_yunet_2023mar.onnx", recognizer = "opencv/face_recognition_sface_2021dec.onnx", arcface = "auraface/glintr100.onnx" }

