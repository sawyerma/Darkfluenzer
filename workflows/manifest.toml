# ------------------------------------------------------------------------------------ Workflows (registriert)
# Nur reale, vorhandene Workflows (UI-Export + API-Export). Grundlage: Betreiberpaket
# ComfyUI_Cinematic_Studio_M4 bzw. offizielle ComfyUI-Vorlagen, technisch korrigiert wo nötig.
# UI-Export wird mit `darkfluenzer workflows check` gegen den API-Export und die laufende ComfyUI geprüft.
# Parameter: label = Feldname im Cockpit, expert = in „Erweiterte Workflow-Einstellungen“
# (Standard: Zahlen ja, Texte und Dateien nein), mask_output = SaveImage-Node der erzeugten Maske
# (Pixelprüfung: außerhalb der Maske bleibt das Quellbild unverändert).

[workflows.lustify_sdxl_t2i]
engine = "lustify_sdxl"
ui = "image/lustify_sdxl_t2i.ui.json"
api = "image/lustify_sdxl_t2i.api.json"
status = "PASS"
title = "LUSTIFY · Text zu Bild"

[workflows.lustify_sdxl_t2i.params]
prompt = { node = "2", input = "text", type = "str", required = true }
negative_prompt = { node = "3", input = "text", type = "str" }
seed = { node = "5", input = "seed", type = "int", min = 0, max = 4294967295 }
steps = { node = "5", input = "steps", type = "int", min = 8, max = 80 }
