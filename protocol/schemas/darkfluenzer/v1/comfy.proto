syntax = "proto3";

package darkfluenzer.v1;

// Projektionen der verwalteten ComfyUI-Instanzen (Medien-ComfyUI 1, KI-ComfyUI 2) und der vom
// Backend ausgeführten Renderungen.

enum ComfyState {
  COMFY_STATE_UNSPECIFIED = 0;
  COMFY_STATE_STOPPED = 1;
  COMFY_STATE_STARTING = 2;
  COMFY_STATE_READY = 3;
  COMFY_STATE_STOPPING = 4;
  // Prozess lebt oder Port ist belegt, aber /system_stats antwortet nicht.
  COMFY_STATE_UNREACHABLE = 5;
  // Letzter Start/Stop ist fehlgeschlagen; error enthält den Grund.
  COMFY_STATE_FAILED = 6;
  // Bereit und mit mindestens einem laufenden Auftrag beschäftigt.
  COMFY_STATE_BUSY = 7;
}

// STATE comfy.status
message ComfyStatus {
  ComfyState state = 1;
  // true: vom Darkfluenzer gestartete Instanz, die das Backend starten/stoppen darf.
  bool managed = 2;
  string url = 3;
  string version = 4;
  string device = 5;
  string error = 6;
  uint32 queue_running = 7;
  uint32 queue_pending = 8;
  // media | ai
  string name = 9;
}

// STATE comfy.instances: alle konfigurierten Instanzen (die KI-Instanz erst mit [comfyui_ai]).
message ComfyInstances {
  repeated ComfyStatus instances = 1;
}

// Speicherbelegung einer Instanz aus Sicht der Zulassung.
message InstanceLoad {
  string name = 1;
  // Engine des letzten Laufs (deren Modelle können noch geladen sein); leer = nichts geladen
  string engine = 2;
  // Auftrag, der auf freien Speicher wartet (0 = keiner)
  uint64 waiting_job = 3;
  // Gemessener (sonst aus Modellgrößen geschätzter) Bedarf des wartenden Auftrags in GB
  double need_gb = 4;
}

// STATE resources: gemeinsamer Unified Memory beider Instanzen und Zulassung (V0 §4.2).
message Resources {
  double ram_total_gb = 1;
  double ram_free_gb = 2;
  double swap_used_mb = 3;
  // Mindestens frei zu haltender Speicher (local/config.toml [server] memory_reserve_gb)
  double reserve_gb = 4;
  repeated InstanceLoad instances = 5;
}

// Ein Auftrag in der ComfyUI-Warteschlange.
message ActiveJob {
  // 0: nicht über Darkfluenzer eingereicht (z. B. direkt in der ComfyUI-Oberfläche).
  uint64 job_id = 1;
  string workflow = 2;
  // false: wartet in der Warteschlange.
  bool running = 3;
  // Fortschritt des laufenden Nodes (z. B. Sampler-Schritte); 0/0, solange ComfyUI keinen meldet
  // (nur für vom Backend eingereichte Aufträge verfügbar).
  uint32 progress_value = 4;
  uint32 progress_max = 5;
  // Parameter des Auftrags als Text (Prompt, Seed, …); Upload-Parameter als Dateipfad.
  map<string, string> params = 6;
  // Ausführende Instanz (media | ai)
  string instance = 7;
}

// STATE jobs.active
message JobsActive {
  reserved 2;
  repeated ActiveJob jobs = 1;
  // Angehaltene Warteschlangen (Instanznamen): der laufende Auftrag endet regulär, danach startet
  // dort nichts bis zum Fortsetzen.
  repeated string paused = 4;
  // Domain-Version der Jobs (steigt mit jedem angelegten Job und Statuswechsel).
  uint64 version = 3;
}

// Parameter eines Workflows laut Registry; default ist der Wert im registrierten API-Graphen.
message WorkflowParam {
  string name = 1;
  // str | int | float
  string type = 2;
  bool required = 3;
  // Datei, die vor dem Lauf zu ComfyUI hochgeladen wird (Quellbild, Maske, Startbild).
  bool upload = 4;
  optional double min = 5;
  optional double max = 6;
  uint32 multiple_of = 7;
  repeated string choices = 8;
  oneof default {
    string text = 9;
    int64 integer = 10;
    double number = 11;
  }
  // Feldname im Cockpit (leer: Standardbezeichnung des Parameternamens)
  string label = 12;
  // in „Erweiterte Workflow-Einstellungen“ (sonst Grundeinstellung in der Mitte)
  bool expert = 13;
  // Vorlagen-Parameter: erscheint rechts als „Vorlage“ (aus Dateien bzw. Kloner-Eingang), C1
  bool reference = 14;
}

// Registrierter Workflow (workflows/manifest.toml) und Bereitschaft seiner Modelldateien.
message WorkflowInfo {
  string key = 1;
  string engine = 2;
  string engine_title = 3;
  // image | video
  string kind = 4;
  // PASS | OFFEN | GESPERRT
  string status = 5;
  bool models_ready = 6;
  double missing_gb = 7;
  // evaluation | production
  string usage = 8;
  string title = 9;
  bool enabled = 10;
  // Die Editor-Kopie in ComfyUI weicht vom registrierten UI-Export ab (übernehmbar).
  bool editor_changed = 11;
  repeated WorkflowParam params = 12;
  // Ausführende Instanz (media | ai) laut Engine
  string instance = 13;
  // Trainingsworkflow: trainiert eine Charakter-LoRA aus dem Trainingsdatenordner (B1)
  bool training = 14;
  // Ausgabeprofile der Engine (V0 §9.7), nur bei Workflows mit Breite und Höhe
  repeated OutputFormat formats = 15;
  // Rolle der Engine laut Manifest (master, edit, upscale, output, …)
  string role = 16;
  // Inhaltsstufe der Ergebnisse (Regel 13): standard | explizit (ohne Manifest-Eintrag explizit);
  // Kundenaufträge nur mit standard
  string content = 17;
}

message OutputFormat {
  // z. B. 3:4
  string name = 1;
  uint32 width = 2;
  uint32 height = 3;
}

// STATE comfy.workflows
message Workflows {
  repeated WorkflowInfo workflows = 1;
  // Registry-Version (Manifest und Workflow-Graphen); CAS-Basis für Workflow-Befehle und Render.
  uint64 version = 2;
}

message JobOutput {
  // Pfad relativ zu local/.
  string path = 1;
  string sha256 = 2;
  uint64 size = 3;
}

enum JobResult {
  JOB_RESULT_UNSPECIFIED = 0;
  JOB_RESULT_DONE = 1;
  JOB_RESULT_FAILED = 2;
  // Vom Betreiber aus der Warteschlange entfernt oder abgebrochen.
  JOB_RESULT_CANCELLED = 3;
}

// EVENT job.completed: eine abgeschlossene Renderung aus der jobs-Tabelle.
message JobCompleted {
  uint64 job_id = 1;
  string workflow = 2;
  string engine = 3;
  JobResult result = 4;
  string error = 5;
  double duration_s = 6;
  // Noch vorhandene Ausgaben (vom Betreiber gelöschte fehlen).
  repeated JobOutput outputs = 7;
  // Leer bei Renderungen ohne Kundenbezug (Evaluation).
  string order_no = 8;
  map<string, string> params = 9;
}
