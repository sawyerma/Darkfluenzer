syntax = "proto3";

package darkfluenzer.v1;

import "darkfluenzer/v1/order.proto";

// Nachrichten-Cockpit und Kanal-Adapter (PHASENPLAN_V0 §6/§8, FRONT F4/F7.2–F7.4).
// Plattformen: telegram | instagram | whatsapp. Plattform-Tokens erscheinen nie im Frontend.

// Testbetrieb: zuletzt verworfener Einzelchat (nur ID und Zeit, nur im Speicher des Backends),
// damit der Betreiber die Chat-ID seines Testpartners in test_chat_ids übernehmen kann.
message RejectedChat {
  int64 chat_id = 1;
  int64 at_ms = 2;
}

// Zustand eines Kanal-Adapters (STATE channels).
message ChannelStatus {
  string platform = 1;
  // Konto der Influencerin auf der Plattform (Bot-Benutzername, Instagram-Konto)
  string account = 2;
  // OFF (nicht eingerichtet) | CONNECTING | READY | ERROR
  string state = 3;
  string error = 4;
  // Zeit des letzten Plattform-Ereignisses (Unix-ms, 0 = noch keins)
  int64 last_event_ms = 5;
  // Was zur Einrichtung fehlt (z. B. „api_id/api_hash im Schlüsselbund“); leer, wenn eingerichtet
  string missing = 6;
  // Kontoanmeldung (Telegram über TDLib, V0 §6.1): phone | code | password | ready; leer = noch
  // kein Anmeldeschritt (TDLib startet bzw. Voraussetzung fehlt)
  string login_state = 7;
  // Hinweis zum Zwei-Faktor-Passwort, wie bei Telegram hinterlegt
  string login_hint = 8;
  // Testbetrieb: nur freigegebene Test-Chats, KI-Antworten gesperrt
  bool test_mode = 9;
  // Automatik je Konto vom Betreiber freigegeben (Standard aus)
  bool automation = 10;
  // Telegram bremst den Versand bis zu dieser Zeit (Unix-ms; 0 = keine Bremse)
  int64 flood_until_ms = 11;
  repeated RejectedChat rejected_chats = 12;
  // Kanalkonto (SP2 Schritt 9a): Kürzel, Influencerin, Betriebsart, Kundentransport, Default-Absender
  string key = 13;
  uint64 influencer_id = 14;
  string influencer = 15;
  string operating_mode = 16;
  string transport = 17;
  string default_sender_id = 18;
}

// STATE channels
message Channels {
  repeated ChannelStatus channels = 1;
  uint64 version = 2;
}

// Eine Kundenakte in der linken Liste (F7.2). Der interne Kontakt Default hat kind "internal".
message CustomerSummary {
  uint64 customer_id = 1;
  string customer_no = 2;
  string display_name = 3;
  // customer | internal
  string kind = 4;
  // verknüpfte Plattformen
  repeated string platforms = 5;
  string last_text = 6;
  string last_platform = 7;
  int64 last_ms = 8;
  uint32 unread = 9;
  // Altersangabe (Regel 13, nur Betreiber): unclear | under_18 | self_declared_adult
  string age_mark = 11;
  // Plattformkennungen der verknüpften Konten (Handle und Nutzer-ID) für die Suche (F7.2)
  repeated string handles = 10;
  // Influencerin und Kanalkonto der Akte (C5.1); slot = Farbe der Figur (1–6, Token im Stylesheet)
  uint64 influencer_id = 12;
  string influencer_name = 13;
  uint32 influencer_slot = 14;
  string account = 15;
}

// EVENT customers.updated: geänderte Kundenakte (neu, gelesen, umbenannt …)
message CustomerUpdated {
  CustomerSummary customer = 1;
}

// HTTP GET /api/v1/customer-page: alle Kundenakten (bei Aufruf und nach Lücken)
message CustomerPage {
  repeated CustomerSummary customers = 1;
  // Domain-Version „customers“
  uint64 version = 2;
}

message MessageAttachment {
  // photo | video | voice | audio | document | sticker | share | reel | post | other
  string kind = 1;
  // Pfad relativ zu local/ (leer, solange nicht gesichert oder nicht importierbar)
  string path = 2;
  string mime = 3;
  uint64 size = 4;
  string sha256 = 5;
  // saved | pending | too_large | not_importable | failed
  string status = 6;
  string note = 7;
}

// Ein Eintrag im Verlauf einer Kundenakte (Nachricht oder Systemkarte).
message ConversationItem {
  uint64 item_id = 1;
  uint64 customer_id = 2;
  // telegram | instagram | whatsapp | system
  string platform = 3;
  // in | out | system
  string direction = 4;
  string text = 5;
  repeated MessageAttachment attachments = 6;
  // received | queued | sending | sent | failed | unknown
  string status = 7;
  int64 at_ms = 8;
  // Absender (Handle bzw. „Darkfluenzer“)
  string sender = 9;
  string error = 10;
  bool read = 11;
  uint64 conversation_id = 12;
  // Systemkarte INTERNER AUFTRAG: Auftrag mit Stufe, Kandidaten/Ergebnis und Fehlern (F4/F7.4);
  // jedes Auftragsereignis liefert die Karte erneut als conversations.event
  ActiveOrder order = 13;
  // Systemkarte eines erkannten Kloner-Auftrags, der auf den Betreiberstart wartet
  // („Automatische Produktionsaufträge“ aus, V0 §8)
  bool awaiting_start = 14;
  // Plattform meldet eine Bearbeitung (SP2 Schritt 5): Zeit und erster Text; 0/leer = unverändert
  int64 edited_at_ms = 15;
  string original_text = 16;
  // Plattform meldet die Löschung: Löschmarke; der Inhalt bleibt bis zur Regel aus SP6 Schritt 8
  int64 deleted_at_ms = 17;
  // KI-Antwort (SP4 Schritte 6, 7): geplante Sendezeit (Status queued) und Sprachlauf; Entwurf
  // = Status draft mit Grund in error, storniert = cancelled
  int64 scheduled_at_ms = 18;
  uint64 ai_run_id = 19;
  // gehört zum Kundentest im Default-Chat (SP4 Schritt 8), nie zur Produktion
  bool test = 20;
}

// EVENT conversations.event: Nachricht neu oder geändert (Status, Anhänge)
message ConversationEvent {
  ConversationItem item = 1;
}

// Verknüpftes Plattformkonto einer Kundenakte mit seiner Konversation (Antwortziel).
message ChannelIdentity {
  uint64 identity_id = 1;
  string platform = 2;
  string account = 3;
  string platform_user_id = 4;
  string handle = 5;
  bool verified = 6;
  uint64 conversation_id = 7;
  // Gesprächsrevision (CAS für Antworten)
  uint64 revision = 8;
  // KI-Hinweis (Regel 12 b): leer = nicht ausgelöst, sonst Status der Hinweisnachricht
  // (queued | sending | sent | failed | unknown)
  string ai_notice = 9;
  // Instagram-Antwortfenster (FRONT F4 Punkt 10): offen bis (Unix-ms, 0 = abgelaufen bzw. kein
  // Instagram) und das verlängerte Fenster für manuelle Antworten mit Human-Agent-Kennzeichnung
  int64 window_until_ms = 10;
  int64 human_until_ms = 11;
  // Modus der Konversation (SP4 Schritt 6): auto | draft | manual
  string mode = 12;
}

// Operator-Felder des internen Kontakts Default (F7.4, V0 §8/§8.1).
message DefaultContact {
  uint64 customer_id = 1;
  string telegram_sender_id = 2;
  string instagram_sender_id = 3;
  bool process_commands = 4;
  bool auto_orders = 5;
  // direct | cockpit | cockpit_only
  string approval_mode = 6;
  string influencer = 7;
  string media_workflow = 8;
  uint64 revision = 9;
  // Video-Workflow für `animate` (Foto -> Video); die übrigen Befehle nutzen media_workflow
  string video_workflow = 10;
  // Workflow je Befehl (FL-6); fehlt ein Befehl, gilt media_workflow bzw. video_workflow
  repeated CommandWorkflow command_workflows = 11;
  // Kandidaten je Bild der Default-Kette (SP1 Schritt 7); 0 = Vorgabe aus der Konfiguration
  uint32 cloner_candidates = 12;
  uint32 cloner_candidates_default = 13;
  // Chat-Wort: bricht den laufenden Auftrag dieses Chats ab (SP1 Schritt 11); leer = aus
  string cancel_word = 14;
  // Betriebsart je Kanalkonto (SP1 Schritt 12)
  repeated AccountMode account_modes = 15;
  // Kundentest (SP4 Schritt 8): Verzögerung wie Kunde, laufende Testsitzung
  bool test_delay = 16;
  uint32 test_session = 17;
}

message CommandWorkflow {
  // clone | pose | style | remix | animate | edit
  string command = 1;
  string workflow = 2;
  // Ausgabeprofil des Befehls (SP1 Schritt 6): Formatname der Engine (z. B. 9:16), Dauer in
  // Sekunden (nur Video), Fertigstellen-Workflow (z. B. output_instagram); Wunsch im Chat geht vor
  string format = 3;
  double duration_s = 4;
  string finish = 5;
}

// Betriebsart eines Kanalkontos für seine Default-Identität (SP1 Schritt 12)
message AccountMode {
  string key = 1;
  // production | test | off
  string mode = 2;
}

// HTTP GET /api/v1/conversation-page?customer=ID[&before=ITEM]: Verlauf (neueste zuerst
// abgeschnitten, aufsteigend geliefert) mit Identitäten und ggf. Default-Feldern.
message ConversationPage {
  CustomerSummary customer = 1;
  repeated ConversationItem items = 2;
  bool more = 3;
  repeated ChannelIdentity identities = 4;
  // nur beim internen Kontakt
  DefaultContact default_contact = 5;
  uint64 version = 6;
}
