syntax = "proto3";

package darkfluenzer.v1;

// Galerie "Dateien": alle erzeugten Bilder und Videos aus dem Medienindex (SQLite, Tabelle media).
// Neue Einträge als EVENT media.added; ältere seitenweise per
//   GET /api/v1/media-page?before=<media_id>&limit=<n>  -> MediaPage (application/x-protobuf).
// Die Datei selbst nur über den sitzungsgeschützten Pfad /api/v1/media/<path>.
// Gelöschte Einträge als EVENT media.removed (Befehl DeleteMedia); IDs und Nummern werden nie
// wieder vergeben.

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
}

enum MediaOrigin {
  MEDIA_ORIGIN_UNSPECIFIED = 0;
  // Ausgabe eines Darkfluenzer-Renderjobs
  MEDIA_ORIGIN_RENDER = 1;
  // Frühere Datei unter local/evaluation (vor dem Job-Journal)
  MEDIA_ORIGIN_EVALUATION = 2;
  // Direkt in der verwalteten ComfyUI erzeugt
  MEDIA_ORIGIN_COMFYUI = 3;
  // Artefakt eines Kundenauftrags
  MEDIA_ORIGIN_ORDER = 4;
}

message MediaItem {
  // Stabile ID des Medienindex (Dedupe auch nach Reconnect).
  uint64 media_id = 1;
  MediaKind kind = 2;
  // Kundenauftrag: hinterlegter Kundenname (sonst Kundennummer); eigene Medien: laufende Nummer.
  string caption = 3;
  // Pfad relativ zu local/ (für den Medienpfad).
  string path = 4;
  uint64 size = 5;
  string sha256 = 6;
  int64 created_unix_ms = 7;
  MediaOrigin origin = 8;
  string workflow = 9;
  map<string, string> params = 10;
  uint64 job_id = 11;
  string order_no = 12;
  string customer_no = 13;
}

// Vom Betreiber gelöschter Galerie-Eintrag (Datei samt gleicher Kopien entfernt).
message MediaRemoved {
  uint64 media_id = 1;
  // Pfad relativ zu local/ (auch Ausgabe eines Renderjobs in JobCompleted.outputs).
  string path = 2;
}

message MediaPage {
  repeated MediaItem items = 1;
  // Es gibt ältere Einträge.
  bool more = 2;
}

// Herkunft eines Mediums: GET /api/v1/provenance/<media_id> -> MediaProvenance
// (application/x-protobuf, Sitzung). Medien sind unveränderlich und IDs werden nie neu vergeben:
// die Antwort zu einer media_id bleibt gleich (einmal abrufen, dann behalten).
message ProvenanceInput {
  string param = 1;
  // Pfad relativ zu local/ der tatsächlich hochgeladenen Eingabedatei.
  string path = 2;
  string sha256 = 3;
}

message ProvenanceModel {
  string file = 1;
  string repo = 2;
  string revision = 3;
  string sha256 = 4;
}

// Widget-Wert eines Nodes im eingereichten Graphen (Verbindungen ausgelassen), als Text.
message GraphInput {
  string name = 1;
  string value = 2;
}

message GraphNode {
  string id = 1;
  string class_type = 2;
  repeated GraphInput inputs = 3;
}

// Speicherverlauf des Laufs (freier Unified Memory laut ComfyUI, macOS-Swap).
message MemoryTrace {
  double ram_total_gb = 1;
  double ram_free_start_gb = 2;
  double ram_free_min_gb = 3;
  double ram_free_end_gb = 4;
  double swap_start_mb = 5;
  double swap_max_mb = 6;
  double swap_end_mb = 7;
}

message MediaProvenance {
  uint64 media_id = 1;
  // 0: Datei ohne Darkfluenzer-Renderjob (z. B. direkt in ComfyUI erzeugt)
  uint64 job_id = 2;
  string workflow = 3;
  // Titel des Workflows, solange er registriert ist (sonst leer)
  string workflow_title = 4;
  string engine = 5;
  // SHA-256 der API-Workflow-Datei beim Einreichen
  string workflow_sha256 = 6;
  string prompt_id = 7;
  double duration_s = 8;
  // Medium, aus dem der Auftrag hervorging (0 = keines)
  uint64 parent_media_id = 9;
  map<string, string> params = 10;
  repeated ProvenanceInput inputs = 11;
  repeated ProvenanceModel models = 12;
  // Exakt eingereichter API-Graph (fehlt bei Aufträgen vor dem Graph-Snapshot)
  repeated GraphNode graph = 13;
  MemoryTrace memory = 14;
  // Abgeleitete Versionen: Medien aus Aufträgen mit diesem Medium als Ausgang (Weiterverarbeiten,
  // Verfeinern, Hochskalieren, Export; F7.6), aufsteigend
  repeated uint64 child_media_ids = 15;
}

