syntax = "proto3";

package darkfluenzer.v1;

// Influencerin-Profile (PHASENPLAN_V0 C5, FRONT F4 V1.12 Punkt 12): gepflegt im Block
// „Influencerin · <Name> · gilt für alle Kunden“ (Kundenakte und Default-Kontakt).

message PriceItem {
  string product = 1;
  // Preis und HD-Aufschlag in Cent (Euro)
  int64 price_cents = 2;
  int64 hd_surcharge_cents = 3;
  // Produkt (SP5 Schritt 1): feste ID (0 = neu), Art image | video, Workflow (Video: Bild-Workflow,
  // finish_workflow = Animation), Kandidaten, Höchstlänge (s), Lieferzeit-Grenze (s, 0 = keine),
  // Zusatzleistungen
  uint64 id = 4;
  string kind = 5;
  string workflow = 6;
  string finish_workflow = 7;
  uint32 candidates = 8;
  double max_duration_s = 9;
  double max_delivery_s = 10;
  bool original_file = 11;
  bool self_destruct = 12;
  // lieferbar (Gates §9.1, aktive LoRA, E14) und sonst die Gründe – nur im STATE
  bool deliverable = 13;
  repeated string problems = 14;
}

message Influencer {
  uint64 influencer_id = 1;
  string name = 2;
  // visuelles Charakterprofil (STATE 5, im ComfyUI-Reiter gepflegt); 0 = keins
  uint64 character_id = 3;
  // Persona-/Charaktertext für die Text-KI
  string persona = 4;
  // KI-Hinweistext, den Clara beim ersten Kontakt je Kanalidentität einmal sendet (V0 Regel 12 b)
  string ai_notice = 5;
  repeated PriceItem prices = 6;
  // Profilrevision (CAS für influencer_update)
  uint64 revision = 7;
  // Promptprofile (SP4 Schritt 2): alle gespeicherten Versionen, unveränderlich, fortlaufend
  repeated PersonaVersion persona_versions = 8;
  // aktive Version (0 = noch keine); wirkt ab dem nächsten Lauf
  uint32 persona_active = 9;
  // laufende Studio-Sitzung im KI-Studio (SP4 Schritt 1, Befehl 50 beginnt eine neue)
  uint32 studio_session = 10;
  // Schalter (C5.1): Text-KI und automatische Antworten
  bool text_ai = 11;
  bool auto_replies = 12;
  // Verhaltensprofil (SP4 Schritt 7): wirksame Werte (Startwerte [behavior] + aktive Version)
  map<string, double> behavior = 13;
  uint32 behavior_version = 14;
  // Verkauf (SP5 Schritt 1): gewählte Zahlungswege, Angebotsgültigkeit (min, 0 = Vorgabe) und die
  // eingerichteten Wege (Konfiguration)
  repeated string payment_ways = 15;
  uint32 offer_valid_min = 16;
  repeated string payment_ways_available = 17;
}

// Eine gespeicherte Fassung des Promptprofils einer Influencerin (SP4 Schritt 2, E19).
message PersonaVersion {
  uint32 version = 1;
  // Block -> Text; Schlüssel aus Influencers.profile_blocks
  map<string, string> blocks = 2;
  // Modellparameter des registrierten Sprachworkflows (Name -> Wert)
  map<string, double> params = 3;
  string note = 4;
  int64 created_ms = 5;
}

// Bearbeitbarer Block des Promptprofils; Reihenfolge und Beschriftung kommen vom Backend.
message ProfileBlock {
  string key = 1;
  string label = 2;
}

// STATE influencers
message Influencers {
  repeated Influencer influencers = 1;
  // feste, nicht editierbare Ehrlichkeitsregel (V0 Regel 12 c)
  string honesty_rule = 2;
  uint64 version = 3;
  // bearbeitbare Blöcke des Promptprofils (SP4 Schritt 2) in Anzeigereihenfolge
  repeated ProfileBlock profile_blocks = 4;
  // Schema-Vertrag der Einstufung (SP4 Schritt 4), den der Block „classification“ verlangen muss
  string assessment_schema = 5;
}
