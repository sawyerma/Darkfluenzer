syntax = "proto3";

package darkfluenzer.v1;

import "darkfluenzer/v1/channel.proto";
import "darkfluenzer/v1/influencer.proto";

// Benutzeraktionen: POST /api/v1/command, Content-Type application/x-protobuf,
// Body CommandRequest, Antwort CommandResponse. Header X-CSRF-Token aus GET /api/v1/session.
// ACCEPTED heißt nur "angenommen". Das Ergebnis ist eine persistierte CommandReceipt
// (EVENT command.receipt: COMPLETED, FAILED, CANCELLED oder UNKNOWN) plus die passende
// STATE/EVENT-Projektion; die Oberfläche zeigt erst den belegten Zustand.

// Instanz: media | ai (leer = media)
message ComfyStart {
  string instance = 1;
}

message ComfyStop {
  string instance = 1;
}

// Wert eines Workflow-Parameters (Name und Typ laut workflows/manifest.toml).
message ParamValue {
  string name = 1;
  oneof value {
    string text = 2;
    int64 integer = 3;
    double number = 4;
  }
}

// Eingabebild für einen Upload-Parameter (Quellbild, Maske, Startbild): entweder hochgeladene
// Bytes oder ein vorhandenes Medium der Galerie über seine unveränderliche ID (exakte Datei,
// SHA-256 vom Backend geprüft).
message InputFile {
  string param = 1;
  string filename = 2;
  bytes data = 3;
  uint64 media_id = 4;
  // Vorlage aus der Bibliothek (nur für Vorlagen-Parameter, SHA-256 geprüft)
  uint64 reference_id = 5;
}

// Renderauftrag ohne Kundenbezug über den registrierten API-Workflow; FIFO im Backend.
// parent_media_id: Medium, aus dem dieser Auftrag hervorgeht (Weiterverarbeiten, Wiederholen,
// Variieren); 0 = neuer Auftrag. repeat_job_id: Parameter und Eingabedateien dieses Jobs desselben
// Workflows übernehmen (Wiederholen); values überschreiben einzelne davon (Variieren: neuer Seed).
message Render {
  string workflow = 1;
  repeated ParamValue values = 2;
  repeated InputFile files = 3;
  uint64 parent_media_id = 4;
  uint64 repeat_job_id = 5;
  // Charakterprofil eines Trainingsworkflows (Datensatz aus dessen Trainingsdatenordner)
  uint64 character_id = 6;
}

// Betreiberentscheidung je Workflow, gespeichert in workflows/manifest.toml.
message SetWorkflowEnabled {
  string workflow = 1;
  bool enabled = 2;
}

// Editor-Kopie bereitstellen; der Browser öffnet danach ComfyUI mit genau diesem Workflow.
message OpenWorkflow {
  string workflow = 1;
}

// Im ComfyUI-Editor gespeicherte Änderung prüfen und als UI- und API-Graph übernehmen.
message AdoptWorkflow {
  string workflow = 1;
}

// Registrierung, UI-/API-Datei und Editor-Kopie entfernen; Modelle, Jobs und Medien bleiben.
message DeleteWorkflow {
  string workflow = 1;
}

// Neuen Workflow als Kopie eines registrierten anlegen (Engine, Parameter, Graph); danach im
// ComfyUI-Editor öffnen, bearbeiten und übernehmen. Status OFFEN bis zur eigenen Abnahme.
message CreateWorkflow {
  string source = 1;
  string title = 2;
}

// Wartenden Auftrag aus der Warteschlange entfernen bzw. laufenden gezielt abbrechen.
message CancelJob {
  uint64 job_id = 1;
}

// Warteschlange einer Instanz anhalten (true) oder fortsetzen (false); leer = media.
message PauseQueue {
  bool paused = 1;
  string instance = 2;
}

// Galerie-Einträge ohne Kundenbezug endgültig löschen (Dateien vom Mac entfernen).
// Kundenmedien sind ausgenommen; bereits gelöschte IDs werden übergangen.
message DeleteMedia {
  repeated uint64 media_ids = 1;
}

// Auftrag des Betreibers mit Stufen (V0 §4.3): Stufe 1 rendert `candidates` Kandidaten des
// Workflows mit fortlaufenden Seeds; danach wählt der Betreiber (SelectCandidate). Mit
// `finish_workflow` wird der ausgewählte Kandidat anschließend dadurch fertiggestellt (dessen
// Eingang `image`). Trägt die Registry-Version (CAS) wie Render.
message CreateOrder {
  string workflow = 1;
  repeated ParamValue values = 2;
  repeated InputFile files = 3;
  uint32 candidates = 4;
  string finish_workflow = 5;
  uint64 parent_media_id = 6;
  // Bezahlter Kundenauftrag (Status paid), der hiermit produziert wird (V0 §8.4 Punkt 5); nur
  // Workflows der Inhaltsstufe standard. Leer: neuer Auftrag des Betreibers.
  string customer_order_no = 7;
}

// Auswahl an der kreativen Stufe; geprüft wird im Backend: Stufe wartet, Medium stammt aus ihr.
message SelectCandidate {
  string order_no = 1;
  uint64 media_id = 2;
}

// Fehlgeschlagene Jobs einer Stufe erneut ausführen (Obergrenze laut Konfiguration).
message RetryStage {
  string order_no = 1;
  uint32 seq = 2;
}

// Charakterprofil anlegen (character_id 0) oder Name/Trainingsdatenordner ändern (CAS über die
// Profilrevision). Ein geänderter Ordner muss existieren; Fotos darin werden nie verändert.
message CharacterUpdate {
  uint64 character_id = 1;
  uint64 revision = 2;
  string name = 3;
  string photos_dir = 4;
}

// Anmeldeschritt eines Kanalkontos (Telegram über TDLib): step phone | code | password. Der Wert
// wird nur an TDLib weitergereicht – nie gespeichert, protokolliert oder angezeigt.
message ChannelAccountLogin {
  string platform = 1;
  string step = 2;
  string value = 3;
}

// Kanalkonto steuern: Automatik freigeben/sperren oder abmelden (Abmelden beendet die Sitzung).
message ChannelAccountUpdate {
  string platform = 1;
  // enable_automation | disable_automation | logout
  string action = 2;
}

// Influencerin-Profil anlegen (influencer_id 0) oder ändern – gilt für alle Kunden dieser Figur
// (FRONT F4 V1.12 Punkt 12); CAS über die Profilrevision. Die Preisliste wird vollständig ersetzt.
message InfluencerUpdate {
  uint64 influencer_id = 1;
  uint64 revision = 2;
  string name = 3;
  uint64 character_id = 4;
  string persona = 5;
  string ai_notice = 6;
  repeated PriceItem prices = 7;
}

// Inhaltsstufe eines Mediums auf „explizit“ anheben – nie absenken (Regel 13).
message MediaContentTier {
  uint64 media_id = 1;
}

// Altersangabe einer Kundenakte setzen (nur Betreiber; Regel 13):
// unclear | under_18 | self_declared_adult (Angabe ≥ 18, Selbstauskunft – keine Verifikation).
message CustomerAgeMark {
  uint64 customer_id = 1;
  string mark = 2;
}

// KI-Hinweistext der Influencerin genau einmal je Kanalidentität über den Postausgang senden
// (Regel 12 b); die Karte KI-HINWEIS GESENDET entsteht beim tatsächlichen Versand.
message SendAiNotice {
  uint64 customer_id = 1;
  uint64 identity_id = 2;
}

// Angebot aus der Preisliste der Influencerin an eine Kundenakte (Befehl 46, V0 §8.4 Punkt 3):
// nur bei Altersangabe ≥ 18 (Selbstauskunft) und gesendetem KI-Hinweis dieser Kanalidentität;
// Preis nur aus der Preisposition (+ HD-Aufschlag), je eingerichtetem Zahlungsweg ein eindeutiger
// Betrag mit Gültigkeit aus config.toml. Karte ANGEBOT im Verlauf; die Nachricht mit Betrag und
// Zahlungswegen geht über den Postausgang an genau diese Konversation (CAS über die Revision).
message CreateOffer {
  uint64 customer_id = 1;
  uint64 identity_id = 2;
  uint64 conversation_id = 3;
  uint64 revision = 4;
  uint64 influencer_id = 5;
  // Position in der Preisliste
  uint32 position = 6;
  bool hd = 7;
  // persönlicher Satz des Betreibers vor den Zahlungsangaben (optional)
  string note = 8;
}

// „Freigeben & senden“ (Befehl 34): Ergebnis eines Kundenauftrags in Prüfung freigeben und hinter
// approval.py (Zahlung, Freigabe, Hash, Kunde, Inhaltsstufe standard) als gekennzeichnete
// Zustellkopie an die Konversation des Angebots senden. not_explicit: ausdrückliche Bestätigung
// des Betreibers, dass das Ergebnis nicht explizit ist.
message ApproveArtifact {
  string order_no = 1;
  uint64 media_id = 2;
  bool not_explicit = 3;
}

// Zustellung erneut senden (Befehl 47) – nur nach endgültig fehlgeschlagener Zustellung, nie bei
// ungeklärtem Versand (unknown).
message RetryDelivery {
  string order_no = 1;
}

// Nicht zugeordneten Eingang einem offenen Angebot zuordnen (Befehl 41, protokolliert).
message PaymentAssign {
  uint64 payment_id = 1;
  string order_no = 2;
}

// Amazon-Gutschein entscheiden (Befehl 42): eingelösten Betrag eintragen (amount_cents > 0) oder
// ablehnen (reject, z. B. ungültiger Code).
message GiftCardConfirm {
  uint64 voucher_id = 1;
  uint32 amount_cents = 2;
  bool reject = 3;
}

// Erkannten Kloner-Auftrag starten, der auf den Betreiberstart wartet (Systemkarte mit
// awaiting_start). Läuft mit dem aktuellen Medien-Workflow des Default-Kontakts; genau einmal.
message StartClonerOrder {
  uint64 item_id = 1;
}

// Ungelesene Nachrichten einer Kundenakte bis einschließlich item_id als gelesen markieren.
message MarkRead {
  uint64 customer_id = 1;
  uint64 up_to_item = 2;
}

// Manuelle Textantwort des Betreibers (F4): nur an die gewählte, verifizierte Konversation dieses
// Kunden, auf der gesehenen Gesprächsrevision (CAS). Kein Sammelversand, kein „alle Kanäle“.
message SendReply {
  uint64 customer_id = 1;
  uint64 identity_id = 2;
  uint64 conversation_id = 3;
  // telegram | instagram | whatsapp (muss zur Identität passen)
  string platform = 4;
  uint64 revision = 5;
  string text = 6;
  // Instagram außerhalb des 24-h-Fensters: manuelle Antwort mit Human-Agent-Kennzeichnung (nur
  // der Betreiber, nie die KI; höchstens bis zum verlängerten Fenster)
  bool human_agent = 7;
}

// Operator-Felder des Default-Kontakts (F7.4) speichern; CAS über DefaultContact.revision.
message DefaultContactUpdate {
  uint64 revision = 1;
  string telegram_sender_id = 2;
  string instagram_sender_id = 3;
  bool process_commands = 4;
  bool auto_orders = 5;
  string approval_mode = 6;
  string influencer = 7;
  string media_workflow = 8;
  // Video-Workflow für `animate` (Foto -> Video, V0 §8); leer: animate nicht möglich
  string video_workflow = 9;
  // vollständige Befehl→Workflow-Zuordnung (FL-6); ersetzt die bisherige
  repeated CommandWorkflow command_workflows = 10;
}

// Kanalidentität einer Kundenakte als Absender des Default-Kontakts festlegen (Befehl 48, F7.4):
// die Identität zieht samt Verlauf zum Default um, eine dadurch leere Kundenakte entfällt.
message DefaultSenderAssign {
  uint64 customer_id = 1;
  uint64 identity_id = 2;
}

message CommandRequest {
  // UUID je Benutzeraktion. Dieselbe ID mit demselben Befehl liefert dieselbe Antwort
  // ohne zweite Ausführung; dieselbe ID mit anderem Befehl wird abgelehnt.
  string request_id = 1;
  // CAS: Domain-Version, auf der die Bedienung beruht. Workflow-Befehle und Render tragen die
  // Registry-Version aus Workflows.version; weicht sie ab, wird der Befehl abgelehnt.
  // 0 bei Befehlen ohne versionierte Domäne (ComfyUI starten/stoppen, Warteschlange, Auftrag
  // abbrechen, Medien löschen – Medien-IDs sind unveränderlich und werden nie neu vergeben).
  uint64 expected_version = 2;
  oneof command {
    ComfyStart comfy_start = 10;
    ComfyStop comfy_stop = 11;
    Render render = 12;
    SetWorkflowEnabled set_workflow_enabled = 13;
    OpenWorkflow open_workflow = 14;
    AdoptWorkflow adopt_workflow = 15;
    DeleteWorkflow delete_workflow = 16;
    CreateWorkflow create_workflow = 17;
    CancelJob cancel_job = 18;
    PauseQueue pause_queue = 19;
    DeleteMedia delete_media = 20;
    CreateOrder create_order = 21;
    SelectCandidate select_candidate = 22;
    RetryStage retry_stage = 24;
    MarkRead mark_read = 29;
    SendReply send_reply = 30;
    DefaultContactUpdate default_contact_update = 37;
    DefaultSenderAssign default_sender_assign = 48;
    CharacterUpdate character_update = 25;
    StartClonerOrder start_cloner_order = 38;
    ChannelAccountLogin channel_account_login = 39;
    ChannelAccountUpdate channel_account_update = 40;
    InfluencerUpdate influencer_update = 35;
    MediaContentTier media_content_tier = 43;
    CustomerAgeMark customer_age_mark = 44;
    SendAiNotice send_ai_notice = 45;
    CreateOffer create_offer = 46;
    ApproveArtifact approve_artifact = 34;
    RetryDelivery retry_delivery = 47;
    PaymentAssign payment_assign = 41;
    GiftCardConfirm gift_card_confirm = 42;
  }
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;
  COMMAND_STATUS_REJECTED = 2;
  // Nur in CommandReceipt: terminale Ergebnisse.
  COMMAND_STATUS_COMPLETED = 3;
  COMMAND_STATUS_FAILED = 4;
  // Ergebnis nicht feststellbar (z. B. Backend während der Ausführung beendet); kein
  // automatischer Neuversuch.
  COMMAND_STATUS_UNKNOWN = 5;
  COMMAND_STATUS_CANCELLED = 6;
}

// Sofortige Antwort: ACCEPTED oder REJECTED, nie ein terminales Ergebnis.
message CommandResponse {
  string request_id = 1;
  CommandStatus status = 2;
  // Ablehnungsgrund für Menschen; leer bei ACCEPTED.
  string detail = 3;
  // Betroffene oder angelegte Entität, z. B. "job:42" oder "workflow:lustify_sdxl_t2i".
  string entity = 4;
}

// EVENT command.receipt: persistierter Lebenszyklus eines Befehls (je Statuswechsel ein Eintrag).
message CommandReceipt {
  string request_id = 1;
  CommandStatus status = 2;
  // Name des Befehls laut CommandRequest, z. B. "render".
  string command = 3;
  string entity = 4;
  string detail = 5;
  // Domain-Version nach dem Effekt (0 = keine versionierte Domäne).
  uint64 version = 6;
}
