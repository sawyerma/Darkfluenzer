syntax = "proto3";

package darkfluenzer.v1;

// Benutzeraktionen: POST /api/v1/command, Content-Type application/x-protobuf,
// Body CommandRequest, Antwort CommandResponse. Header X-CSRF-Token aus GET /api/v1/session.
// ACCEPTED heißt nur "angenommen". Das Ergebnis ist eine persistierte CommandReceipt
// (EVENT command.receipt: COMPLETED, FAILED, CANCELLED oder UNKNOWN) plus die passende
// STATE/EVENT-Projektion; die Oberfläche zeigt erst den belegten Zustand.

// Instanz: media | ai (leer = media)
message ComfyStart {
  string instance = 1;
}

message ComfyStop {
  string instance = 1;
}

// Wert eines Workflow-Parameters (Name und Typ laut workflows/manifest.toml).
message ParamValue {
  string name = 1;
  oneof value {
    string text = 2;
    int64 integer = 3;
    double number = 4;
  }
}

// Eingabebild für einen Upload-Parameter (Quellbild, Maske, Startbild): entweder hochgeladene
// Bytes oder ein vorhandenes Medium der Galerie über seine unveränderliche ID (exakte Datei,
// SHA-256 vom Backend geprüft).
message InputFile {
  string param = 1;
  string filename = 2;
  bytes data = 3;
  uint64 media_id = 4;
}

// Renderauftrag ohne Kundenbezug über den registrierten API-Workflow; FIFO im Backend.
// parent_media_id: Medium, aus dem dieser Auftrag hervorgeht (Weiterverarbeiten, Wiederholen,
// Variieren); 0 = neuer Auftrag. repeat_job_id: Parameter und Eingabedateien dieses Jobs desselben
// Workflows übernehmen (Wiederholen); values überschreiben einzelne davon (Variieren: neuer Seed).
message Render {
  string workflow = 1;
  repeated ParamValue values = 2;
  repeated InputFile files = 3;
  uint64 parent_media_id = 4;
  uint64 repeat_job_id = 5;
}

// Betreiberentscheidung je Workflow, gespeichert in workflows/manifest.toml.
message SetWorkflowEnabled {
  string workflow = 1;
  bool enabled = 2;
}

// Editor-Kopie bereitstellen; der Browser öffnet danach ComfyUI mit genau diesem Workflow.
message OpenWorkflow {
  string workflow = 1;
}

// Im ComfyUI-Editor gespeicherte Änderung prüfen und als UI- und API-Graph übernehmen.
message AdoptWorkflow {
  string workflow = 1;
}

// Registrierung, UI-/API-Datei und Editor-Kopie entfernen; Modelle, Jobs und Medien bleiben.
message DeleteWorkflow {
  string workflow = 1;
}

// Neuen Workflow als Kopie eines registrierten anlegen (Engine, Parameter, Graph); danach im
// ComfyUI-Editor öffnen, bearbeiten und übernehmen. Status OFFEN bis zur eigenen Abnahme.
message CreateWorkflow {
  string source = 1;
  string title = 2;
}

// Wartenden Auftrag aus der Warteschlange entfernen bzw. laufenden gezielt abbrechen.
message CancelJob {
  uint64 job_id = 1;
}

// Warteschlange einer Instanz anhalten (true) oder fortsetzen (false); leer = media.
message PauseQueue {
  bool paused = 1;
  string instance = 2;
}

// Galerie-Einträge ohne Kundenbezug endgültig löschen (Dateien vom Mac entfernen).
// Kundenmedien sind ausgenommen; bereits gelöschte IDs werden übergangen.
message DeleteMedia {
  repeated uint64 media_ids = 1;
}

// Auftrag des Betreibers mit Stufen (V0 §4.3): Stufe 1 rendert `candidates` Kandidaten des
// Workflows mit fortlaufenden Seeds; danach wählt der Betreiber (SelectCandidate). Mit
// `finish_workflow` wird der ausgewählte Kandidat anschließend dadurch fertiggestellt (dessen
// Eingang `image`). Trägt die Registry-Version (CAS) wie Render.
message CreateOrder {
  string workflow = 1;
  repeated ParamValue values = 2;
  repeated InputFile files = 3;
  uint32 candidates = 4;
  string finish_workflow = 5;
  uint64 parent_media_id = 6;
}

// Auswahl an der kreativen Stufe; geprüft wird im Backend: Stufe wartet, Medium stammt aus ihr.
message SelectCandidate {
  string order_no = 1;
  uint64 media_id = 2;
}

// Fehlgeschlagene Jobs einer Stufe erneut ausführen (Obergrenze laut Konfiguration).
message RetryStage {
  string order_no = 1;
  uint32 seq = 2;
}

// Erkannten Kloner-Auftrag starten, der auf den Betreiberstart wartet (Systemkarte mit
// awaiting_start). Läuft mit dem aktuellen Medien-Workflow des Default-Kontakts; genau einmal.
message StartClonerOrder {
  uint64 item_id = 1;
}

// Ungelesene Nachrichten einer Kundenakte bis einschließlich item_id als gelesen markieren.
message MarkRead {
  uint64 customer_id = 1;
  uint64 up_to_item = 2;
}

// Manuelle Textantwort des Betreibers (F4): nur an die gewählte, verifizierte Konversation dieses
// Kunden, auf der gesehenen Gesprächsrevision (CAS). Kein Sammelversand, kein „alle Kanäle“.
message SendReply {
  uint64 customer_id = 1;
  uint64 identity_id = 2;
  uint64 conversation_id = 3;
  // telegram | instagram | whatsapp (muss zur Identität passen)
  string platform = 4;
  uint64 revision = 5;
  string text = 6;
}

// Operator-Felder des Default-Kontakts (F7.4) speichern; CAS über DefaultContact.revision.
message DefaultContactUpdate {
  uint64 revision = 1;
  string telegram_sender_id = 2;
  string instagram_sender_id = 3;
  bool process_commands = 4;
  bool auto_orders = 5;
  string approval_mode = 6;
  string influencer = 7;
  string media_workflow = 8;
  // Video-Workflow für `animate` (Foto -> Video, V0 §8); leer: animate nicht möglich
  string video_workflow = 9;
}

message CommandRequest {
  // UUID je Benutzeraktion. Dieselbe ID mit demselben Befehl liefert dieselbe Antwort
  // ohne zweite Ausführung; dieselbe ID mit anderem Befehl wird abgelehnt.
  string request_id = 1;
  // CAS: Domain-Version, auf der die Bedienung beruht. Workflow-Befehle und Render tragen die
  // Registry-Version aus Workflows.version; weicht sie ab, wird der Befehl abgelehnt.
  // 0 bei Befehlen ohne versionierte Domäne (ComfyUI starten/stoppen, Warteschlange, Auftrag
  // abbrechen, Medien löschen – Medien-IDs sind unveränderlich und werden nie neu vergeben).
  uint64 expected_version = 2;
  oneof command {
    ComfyStart comfy_start = 10;
    ComfyStop comfy_stop = 11;
    Render render = 12;
    SetWorkflowEnabled set_workflow_enabled = 13;
    OpenWorkflow open_workflow = 14;
    AdoptWorkflow adopt_workflow = 15;
    DeleteWorkflow delete_workflow = 16;
    CreateWorkflow create_workflow = 17;
    CancelJob cancel_job = 18;
    PauseQueue pause_queue = 19;
    DeleteMedia delete_media = 20;
    CreateOrder create_order = 21;
    SelectCandidate select_candidate = 22;
    RetryStage retry_stage = 24;
    MarkRead mark_read = 29;
    SendReply send_reply = 30;
    DefaultContactUpdate default_contact_update = 37;
    StartClonerOrder start_cloner_order = 38;
  }
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;
  COMMAND_STATUS_REJECTED = 2;
  // Nur in CommandReceipt: terminale Ergebnisse.
  COMMAND_STATUS_COMPLETED = 3;
  COMMAND_STATUS_FAILED = 4;
  // Ergebnis nicht feststellbar (z. B. Backend während der Ausführung beendet); kein
  // automatischer Neuversuch.
  COMMAND_STATUS_UNKNOWN = 5;
  COMMAND_STATUS_CANCELLED = 6;
}

// Sofortige Antwort: ACCEPTED oder REJECTED, nie ein terminales Ergebnis.
message CommandResponse {
  string request_id = 1;
  CommandStatus status = 2;
  // Ablehnungsgrund für Menschen; leer bei ACCEPTED.
  string detail = 3;
  // Betroffene oder angelegte Entität, z. B. "job:42" oder "workflow:lustify_sdxl_t2i".
  string entity = 4;
}

// EVENT command.receipt: persistierter Lebenszyklus eines Befehls (je Statuswechsel ein Eintrag).
message CommandReceipt {
  string request_id = 1;
  CommandStatus status = 2;
  // Name des Befehls laut CommandRequest, z. B. "render".
  string command = 3;
  string entity = 4;
  string detail = 5;
  // Domain-Version nach dem Effekt (0 = keine versionierte Domäne).
  uint64 version = 6;
}
