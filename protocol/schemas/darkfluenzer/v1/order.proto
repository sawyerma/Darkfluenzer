syntax = "proto3";

package darkfluenzer.v1;

// Auftrag mit Stufen (PHASENPLAN_V0 §4.3): derselbe Typ für Betreiber, Kloner und Kunden.
// B2: Stufe „candidates“ (n Kandidaten, dann Auswahl durch den Betreiber) und „finish“
// (ausgewählter Kandidat durch einen Fertigstellungs-Workflow).

// Ein Job einer Stufe und sein Ergebnis.
message StageJob {
  uint64 job_id = 1;
  int64 seed = 2;
  // queued | running | done | failed
  string status = 3;
  // erstes Bild/Video des Jobs in der Galerie (0 = noch keins)
  uint64 media_id = 4;
  // Pfad relativ zu local/
  string path = 5;
  string error = 6;
}

message OrderStage {
  uint32 seq = 1;
  // candidates | finish
  string kind = 2;
  // running | waiting (Betreiberentscheidung) | done | failed | cancelled
  string status = 3;
  string workflow = 4;
  uint32 count = 5;
  uint64 selected_media_id = 6;
  repeated StageJob jobs = 7;
  string error = 8;
  // Workflow, mit dem der ausgewählte Kandidat fertiggestellt wird (leer: keiner)
  string finish_workflow = 9;
  uint32 attempts = 10;
}

message ActiveOrder {
  string order_no = 1;
  // operator | cloner | customer
  string source = 2;
  // image | video
  string kind = 3;
  string request = 4;
  string status = 5;
  repeated OrderStage stages = 6;
  string created_at = 7;
}

// STATE orders.active: Aufträge in Produktion (Stufen laufen oder warten auf den Betreiber)
message OrdersActive {
  repeated ActiveOrder orders = 1;
  // Domain-Version „orders“
  uint64 version = 2;
  // Kandidatenzahl: Standard und Obergrenze (Konfiguration)
  uint32 candidates_default = 3;
  uint32 candidates_max = 4;
}

// EVENT orders.updated: Auftrag angelegt, Statuswechsel, Stufenwechsel (Journal)
message OrderUpdated {
  string order_no = 1;
  // created | status | stage
  string event = 2;
  string status = 3;
  uint32 seq = 4;
  string kind = 5;
  string detail = 6;
}
