syntax = "proto3";

package darkfluenzer.v1;

// Auftrag mit Stufen (PHASENPLAN_V0 §4.3): derselbe Typ für Betreiber, Kloner und Kunden.
// B2: Stufe „candidates“ (n Kandidaten, dann Auswahl durch den Betreiber) und „finish“
// (ausgewählter Kandidat durch einen Fertigstellungs-Workflow).

// Ein Job einer Stufe und sein Ergebnis.
message StageJob {
  uint64 job_id = 1;
  int64 seed = 2;
  // queued | running | done | failed
  string status = 3;
  // erstes Bild/Video des Jobs in der Galerie (0 = noch keins)
  uint64 media_id = 4;
  // Pfad relativ zu local/
  string path = 5;
  string error = 6;
  // Inhaltsstufe des Kandidaten (Regel 13): standard | explizit; leer = unbekannt
  string content_tier = 7;
}

message OrderStage {
  uint32 seq = 1;
  // candidates | finish
  string kind = 2;
  // running | waiting (Betreiberentscheidung) | done | failed | cancelled
  string status = 3;
  string workflow = 4;
  uint32 count = 5;
  uint64 selected_media_id = 6;
  repeated StageJob jobs = 7;
  string error = 8;
  // Workflow, mit dem der ausgewählte Kandidat fertiggestellt wird (leer: keiner)
  string finish_workflow = 9;
  uint32 attempts = 10;
}

// Eindeutiger Betrag je Zahlungsweg eines Angebots (V0 §8.5 Punkt 2).
message OfferAmount {
  // btc | usdt | usdc
  string method = 1;
  string asset = 2;
  // Dezimaltext, exakt zu zahlen
  string amount = 3;
  // Claras öffentliche Adresse und Netz (bitcoin | bsc)
  string address = 4;
  string network = 5;
  // Kurs (Euro je Einheit) und Kurszeit beim Angebot
  double rate = 6;
  int64 rate_ms = 7;
}

// Angebot eines Kundenauftrags aus der Preisliste (V0 §8.4 Punkt 3).
message CustomerOffer {
  string product = 1;
  bool hd = 2;
  uint32 price_cents = 3;
  int64 expires_ms = 4;
  repeated OfferAmount amounts = 5;
  uint64 conversation_id = 6;
}

// Eine Zustellung (V0 §8.4 Punkt 9): pending (im Postausgang) | sent | failed; „unknown“ =
// Versandausgang ungeklärt (kein automatischer Neuversuch).
message OrderDelivery {
  uint64 delivery_id = 1;
  string status = 2;
  uint64 message_id = 3;
  string error = 4;
  int64 at_ms = 5;
  string path = 6;
}

message ActiveOrder {
  string order_no = 1;
  // operator | cloner | customer
  string source = 2;
  // image | video
  string kind = 3;
  string request = 4;
  string status = 5;
  repeated OrderStage stages = 6;
  string created_at = 7;
  // nur Kundenaufträge
  CustomerOffer offer = 8;
  repeated OrderDelivery deliveries = 9;
  uint64 customer_id = 10;
  string customer_no = 11;
  // Ergebnis zur Freigabe (Status review): Medium der letzten fertigen Stufe, mit Inhaltsstufe
  uint64 result_media_id = 12;
  string result_path = 13;
  string result_tier = 14;
}

// STATE orders.active: Aufträge in Produktion (Stufen laufen oder warten auf den Betreiber)
message OrdersActive {
  repeated ActiveOrder orders = 1;
  // Domain-Version „orders“
  uint64 version = 2;
  // Kandidatenzahl: Standard und Obergrenze (Konfiguration)
  uint32 candidates_default = 3;
  uint32 candidates_max = 4;
  // bezahlte Kundenaufträge, die auf die Produktion warten (Status paid, V0 §8.4 Punkt 5)
  repeated ActiveOrder awaiting_production = 5;
}

// EVENT orders.updated: Auftrag angelegt, Statuswechsel, Stufenwechsel (Journal)
message OrderUpdated {
  string order_no = 1;
  // created | status | stage
  string event = 2;
  string status = 3;
  uint32 seq = 4;
  string kind = 5;
  string detail = 6;
}
