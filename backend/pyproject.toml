[project]
name = "darkfluenzer"
version = "0.5.0"
description = "Lokaler Darkfluenzer-Dienst: ComfyUI-Laufzeit, Workflows, Kundenakte"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14",
    "huggingface-hub>=1.7",
    "numpy>=2.2",
    "pillow>=11",
    # formatbewahrende Änderungen an workflows/manifest.toml (Kommentare bleiben erhalten)
    "tomlkit>=0.13",
    # Laufzeit passend zum Generator libprotoc 33.x (protocol/buf.gen.yaml)
    "protobuf>=6.33,<7",
    "opencv-python-headless>=4.11",
    "segno>=1.6",
]

[project.scripts]
darkfluenzer = "darkfluenzer.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darkfluenzer"]

[tool.ruff]
# Generierter Protobuf-Code (protocol/buf.gen.yaml) wird nicht von Hand formatiert.
extend-exclude = ["src/darkfluenzer/v1"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["mac: echte Mac-Abnahme mit laufender ComfyUI-Installation (DARKFLUENZER_MAC_TESTS=1)"]
