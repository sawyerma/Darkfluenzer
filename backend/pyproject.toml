[project]
name = "darkfluenzer"
version = "0.1.0"
description = "Lokaler Darkfluenzer-Dienst: ComfyUI-Laufzeit, Workflows, Kundenakte"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14",
    "huggingface-hub>=1.7",
    "numpy>=2.2",
    "pillow>=11",
    # Laufzeit passend zum Generator libprotoc 33.x (protocol/buf.gen.yaml)
    "protobuf>=6.33,<7",
]

[project.scripts]
darkfluenzer = "darkfluenzer.app:main"

[project.optional-dependencies]
train = [
    "diffusers>=0.36",
    "peft>=0.17",
    "torch>=2.9",
    "transformers>=4.57",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darkfluenzer"]

[tool.ruff]
# Generierter Protobuf-Code (protocol/buf.gen.yaml) wird nicht von Hand formatiert.
extend-exclude = ["src/darkfluenzer/v1"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["mac: echte Mac-Abnahme mit laufender ComfyUI-Installation (DARKFLUENZER_MAC_TESTS=1)"]
