# Vorlage für local/config.toml (die einzige Konfigurationsdatei; liegt außerhalb von Git).
# Kopieren:  cp config.example.toml local/config.toml  und Pfade an den eigenen Mac anpassen.
# Relative Pfade gelten ab Projektordner.

[server]
# Cockpit (React-Build + Protobuf-API) auf EINEM Origin. Nur Loopback-Adressen sind zulässig.
host = "127.0.0.1"
port = 8190
# Heartbeat an den Browser; bleiben Frames aus, zeigt das Cockpit die Daten als veraltet.
heartbeat_s = 15
# Abstand, in dem das Backend ComfyUI-Prozess und Job-Journal beobachtet (nur bei Änderung Push).
observe_s = 2
# Höchstzahl nachgeladener Ereignisse je Topic nach einem Reconnect.
catchup_limit = 200
# Höchstzahl ungesendeter Ereignis-Frames je Browser; darüber wird er getrennt und holt nach
# (STATE wartet je Topic ohnehin nur mit dem neuesten Stand).
client_queue_max = 2000
# Wartezeit für Start (Health-Check) und Stopp des Cockpit-Servers durch den Launcher.
timeout_s = 20
# Höchstgröße eines Befehls mit Eingabebildern (Quellbild, Maske, Startbild) in MB.
max_upload_mb = 50
# Erzeugte Dateien kommen erst in die Galerie, wenn sie so lange unverändert sind (Sekunden).
media_settle_s = 10
# Zulassung beider ComfyUI-Instanzen: so viel Unified Memory (GB) bleibt nach dem gemessenen Bedarf
# eines Auftrags mindestens frei; sonst entlädt eine ruhende Instanz oder der Auftrag wartet.
memory_reserve_gb = 16

[comfyui]
# Eigener, gepinnter ComfyUI-Checkout (launcher/setup_comfyui.sh) mit main.py.
path = "local/ComfyUI"
# Eigene venv der ComfyUI (launcher/setup_comfyui.sh). Wird direkt ausgeführt, ohne Aktivierung.
python = "local/ComfyUI/.venv/bin/python"
# Nur Loopback-Adressen sind zulässig.
host = "127.0.0.1"
port = 8188
# Zusätzliche ComfyUI-Argumente. --enable-manager ist ab ComfyUI 0.14 + comfyui-manager 4.x verfügbar.
extra_args = ["--enable-manager"]
# Werkzeuge, die ComfyUI/Manager per PATH brauchen (git, ffmpeg). Finder-Apps erben kein Shell-PATH.
path_prepend = ["/opt/homebrew/bin"]
startup_timeout_s = 240
stop_timeout_s = 30

[comfyui.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"
# PYTORCH_MPS_HIGH_WATERMARK_RATIO wird bewusst NICHT gesetzt (PyTorch-Standard).
# 0.0 hebt die MPS-Speichergrenze komplett auf und darf nur nach einem Speichertest gesetzt werden.

# KI-ComfyUI 2 (PHASENPLAN_V0 §4.2): Dialog, Bildbeschreibung, Prompt, KI-Prüfung. Gleicher
# ComfyUI-Code und gemeinsame Modellablage, eigener Port und eigene Ordner (user/input/output/temp
# unter data_dir); eigene Warteschlange, gemeinsame Zulassung nach Speicher ([server]
# memory_reserve_gb). Ohne diesen Abschnitt gibt es nur die Medien-Instanz.
[comfyui_ai]
path = "local/ComfyUI"
python = "local/ComfyUI/.venv/bin/python"
host = "127.0.0.1"
port = 8189
data_dir = "local/comfyui_ai"
extra_args = []
path_prepend = ["/opt/homebrew/bin"]
startup_timeout_s = 240
stop_timeout_s = 30

[comfyui_ai.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"

# Gesichtsprüfung (darkfluenzer identity): kleinere oder unsicherere Gesichter gelten als
# „nicht prüfbar“.
[identity]
min_face_px = 64
min_score = 0.8

# Aufträge mit Stufen (PHASENPLAN_V0 §4.3): Kandidaten je Auftrag und Versuche je Stufe.
[production]
candidates_default = 3
candidates_max = 6
stage_attempts_max = 3
