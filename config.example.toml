# Vorlage für local/config.toml (die einzige Konfigurationsdatei; liegt außerhalb von Git).
# Kopieren:  cp config.example.toml local/config.toml  und Pfade an den eigenen Mac anpassen.
# Relative Pfade gelten ab Projektordner.

[server]
# Cockpit (React-Build + Protobuf-API) auf EINEM Origin. Nur Loopback-Adressen sind zulässig.
host = "127.0.0.1"
port = 8190
# Heartbeat an den Browser; bleiben Frames aus, zeigt das Cockpit die Daten als veraltet.
heartbeat_s = 15
# Abstand, in dem das Backend ComfyUI-Prozess und Job-Journal beobachtet (nur bei Änderung Push).
observe_s = 2
# Höchstzahl nachgeladener Ereignisse je Topic nach einem Reconnect.
catchup_limit = 200
# Höchstzahl ungesendeter Ereignis-Frames je Browser; darüber wird er getrennt und holt nach
# (STATE wartet je Topic ohnehin nur mit dem neuesten Stand).
client_queue_max = 2000
# Wartezeit für Start (Health-Check) und Stopp des Cockpit-Servers durch den Launcher.
timeout_s = 20
# Höchstgröße eines Befehls mit Eingabebildern (Quellbild, Maske, Startbild) in MB.
max_upload_mb = 50
# Erzeugte Dateien kommen erst in die Galerie, wenn sie so lange unverändert sind (Sekunden).
media_settle_s = 10
# Zulassung beider ComfyUI-Instanzen: so viel Unified Memory (GB) bleibt nach dem gemessenen Bedarf
# eines Auftrags mindestens frei; sonst entlädt eine ruhende Instanz oder der Auftrag wartet.
memory_reserve_gb = 16

[comfyui]
# Eigener, gepinnter ComfyUI-Checkout (launcher/setup_comfyui.sh) mit main.py.
path = "local/ComfyUI"
# Eigene venv der ComfyUI (launcher/setup_comfyui.sh). Wird direkt ausgeführt, ohne Aktivierung.
python = "local/ComfyUI/.venv/bin/python"
# Nur Loopback-Adressen sind zulässig.
host = "127.0.0.1"
port = 8188
# Zusätzliche ComfyUI-Argumente. --enable-manager ist ab ComfyUI 0.14 + comfyui-manager 4.x verfügbar.
extra_args = ["--enable-manager"]
# Werkzeuge, die ComfyUI/Manager per PATH brauchen (git, ffmpeg). Finder-Apps erben kein Shell-PATH.
path_prepend = ["/opt/homebrew/bin"]
startup_timeout_s = 240
stop_timeout_s = 30

[comfyui.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"
# MPS-Obergrenze (Speichertest 15.11.2026, M4 Max 128 GB): Der PyTorch-Standard erlaubt ≈ 163 GiB
# und treibt große Läufe (Krea-2-Training) in massiven Swap. 0.9 begrenzt auf ≈ 86 GiB, ein
# Überlauf bricht dann sauber ab. Die untere Grenze muss ≤ der oberen sein. 0.0 (keine Grenze)
# ist ausgeschlossen.
PYTORCH_MPS_HIGH_WATERMARK_RATIO = "0.9"
PYTORCH_MPS_LOW_WATERMARK_RATIO = "0.8"

# KI-ComfyUI 2 (PHASENPLAN_V0 §4.2): Dialog, Bildbeschreibung, Prompt, KI-Prüfung. Gleicher
# ComfyUI-Code und gemeinsame Modellablage, eigener Port und eigene Ordner (user/input/output/temp
# unter data_dir); eigene Warteschlange, gemeinsame Zulassung nach Speicher ([server]
# memory_reserve_gb). Ohne diesen Abschnitt gibt es nur die Medien-Instanz.
[comfyui_ai]
path = "local/ComfyUI"
python = "local/ComfyUI/.venv/bin/python"
host = "127.0.0.1"
port = 8189
data_dir = "local/comfyui_ai"
extra_args = []
path_prepend = ["/opt/homebrew/bin"]
startup_timeout_s = 240
stop_timeout_s = 30

[comfyui_ai.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"

# Gesichtsprüfung (darkfluenzer identity): kleinere oder unsicherere Gesichter gelten als
# „nicht prüfbar“.
[identity]
min_face_px = 64
min_score = 0.8

# Aufträge mit Stufen (PHASENPLAN_V0 §4.3): Kandidaten je Auftrag und Versuche je Stufe.
[production]
candidates_default = 3
candidates_max = 6
stage_attempts_max = 3
video_max_s = 120   # Obergrenze der Videolänge in Sekunden (Abschnitte à höchstens 5 s werden aneinandergereiht)

# Claras Telegram-Konto (PHASENPLAN_V0 §6.1, C2d): Darkfluenzer meldet sich über TDLib als normales
# Nutzerkonto an (kein Bot). TDLib bauen: launcher/setup_tdlib.sh. api_id/api_hash von
# my.telegram.org (API development tools) liegen ausschließlich im macOS-Schlüsselbund:
#   security add-generic-password -U -a darkfluenzer -s darkfluenzer.telegram.api_id -w
#   security add-generic-password -U -a darkfluenzer -s darkfluenzer.telegram.api_hash -w
# Den Datenbankschlüssel legt Darkfluenzer beim ersten Start selbst im Schlüsselbund an.
# Anmeldung (Nummer -> Code -> Passwort) im Cockpit, Reiter Nachrichten. Ohne diesen Abschnitt ist
# Telegram nicht eingerichtet. Testbetrieb (bis Claras SIM da ist): nur test_chat_ids werden
# verarbeitet und gespeichert, alle anderen Chats verworfen; KI-Antworten gesperrt.
[telegram_account]
tdjson = "local/tdlib/libtdjson.dylib"
data_dir = "local/telegram"
test_mode = true
test_chat_ids = []
max_download_mb = 2000
# Antworttempo gegen Sperren: Verzögerung vor jeder Nachricht, Schreibanzeige, Höchstzahl je Minute
reply_delay_min_s = 4
reply_delay_max_s = 20
typing_chars_per_s = 6
max_messages_per_minute = 6

# Claras Instagram-Creator-Konto (PHASENPLAN_V0 §6, §6.1): offizielle Instagram-API mit
# Instagram-Login; Darkfluenzer veröffentlicht nichts. Meta-App (kostenlos) mit Instagram-Login und
# Nachrichtenberechtigung; Instagram-App-ID, Instagram-App-Geheimnis und ein selbst gewähltes
# Verify-Token (gleicher Wert im Webhook-Dialog der Meta-App) nur im Schlüsselbund:
#   security add-generic-password -U -a darkfluenzer -s darkfluenzer.instagram.app_id -w
#   security add-generic-password -U -a darkfluenzer -s darkfluenzer.instagram.app_secret -w
#   security add-generic-password -U -a darkfluenzer -s darkfluenzer.instagram.verify_token -w
# Zugangstoken (ca. 60 Tage, rechtzeitig erneuert) und Medienschlüssel legt Darkfluenzer selbst an.
# Öffentlich über den Tunnel (§10 Punkt 1) nur diese drei Pfade, je mit eigener Prüfung:
# webhook_path (Meta-Signatur), oauth_path (OAuth-state), media_path (kurzlebiges signiertes Token).
# Tunnel-Ziel ist ausschließlich der öffentliche Eingang http://127.0.0.1:<server.public_port>
# (Standard: Cockpit-Port + 1), NIE der Cockpit-Port selbst (bugs_v1 BUG-002).
# In der Meta-App eintragen: Webhook = public_base_url + webhook_path,
# OAuth-Weiterleitung = public_base_url + oauth_path. Ohne public_base_url bleibt Instagram aus.
[instagram]
public_base_url = ""   # feste Tunnel-Adresse, z. B. "https://<mac>.<tailnet>.ts.net"
webhook_path = "/instagram/webhook"
oauth_path = "/instagram/oauth"
media_path = "/instagram/media"
graph_url = "https://graph.instagram.com"
graph_version = "v24.0"
oauth_authorize_url = "https://www.instagram.com/oauth/authorize"
oauth_token_url = "https://api.instagram.com/oauth/access_token"
scopes = ["instagram_business_basic", "instagram_business_manage_messages"]
subscribed_fields = ["messages", "messaging_seen", "messaging_postbacks"]
# Empfang: Medien sofort sichern (CDN-Adressen laufen ab); Versand: Meta-Grenzen je Medienart
max_download_mb = 100
max_image_mb = 8
max_video_mb = 25
max_audio_mb = 25
max_text_bytes = 1000
media_url_ttl_s = 900            # Gültigkeit der signierten Medien-URL für den Abruf durch Meta
oauth_state_ttl_s = 600
token_refresh_margin_s = 864000  # Token so lange vor Ablauf erneuern (10 Tage)
token_refresh_retry_s = 3600
check_s = 60                     # Schlüsselbund, Token und Konto prüfen
download_timeout_s = 300
profile_timeout_s = 5
# Antwortfenster: 24 h nach der letzten Kundennachricht; danach nur manuell mit Human-Agent-Tag
reply_window_h = 24
human_agent_window_h = 168
max_messages_per_minute = 30


# Zahlungseingang (PHASENPLAN_V0 §8.5, C5a): Darkfluenzer beobachtet nur Claras ÖFFENTLICHE Adressen
# aus MetaMask – nie Seed oder Schlüssel, kein Senden. Ungültige Adressen (Format/Prüfsumme) erscheinen
# im Reiter Wallet mit Grund. Datenquellen kostenlos und ohne Konto; BSC ohne eth_getLogs (Header-
# Bloom + Block-Receipts, da öffentliche Endpunkte getLogs verweigern).
[wallet]
btc_address = ""   # Native SegWit (bc1…)
bsc_address = ""   # EVM-Adresse mit EIP-55-Prüfsumme (aus MetaMask kopieren)
btc_api = "https://mempool.space/api"
bsc_rpc = "https://bsc-dataseed.bnbchain.org"
price_api = "https://api.coingecko.com/api/v3/simple/price"
btc_price_id = "bitcoin"
btc_confirmations = 2
bsc_confirmations = 15
poll_s = 60
bsc_header_batch = 100
offer_valid_min = 60   # Gültigkeit eines Angebots (eindeutiger Betrag) in Minuten, V0 §8.5 Punkt 2

[wallet.tokens.USDT]
contract = "0x55d398326f99059fF775485246999027B3197955"
decimals = 18
price_id = "tether"

[wallet.tokens.USDC]
contract = "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"
decimals = 18
price_id = "usd-coin"
