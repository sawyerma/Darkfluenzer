[project]
name = "darkfluenzer"
version = "0.1.0"
description = "Lokaler Darkfluenzer-Dienst: ComfyUI-Laufzeit, Workflows, Kundenakte"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.7",
]

[project.scripts]
darkfluenzer = "darkfluenzer.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darkfluenzer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["mac: echte Mac-Abnahme mit laufender ComfyUI-Installation (DARKFLUENZER_MAC_TESTS=1)"]
